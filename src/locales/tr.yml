  skipped: Bu uygulama, durağı olmayan veya yinelenen ara istasyonları bulunan {count} hattı gösteremediğinden dışarıda bıraktı.
  error:
    invalid-json: Geçersiz JSON. API yanıtının tamamını yapıştırın.
    invalid-data: Bu JSON, seçilen MTR harita API biçimiyle eşleşmiyor.
    no-routes: İçe aktarılabilir hat bulunamadı.
    too-large: Veri, içe aktarma sınırını (10 MB) aşıyor.
    invalid-url: Kullanıcı adı veya parola içermeyen bir HTTP ya da HTTPS harita/API URL’si ve negatif olmayan bir boyut indeksi girin.
    fetch-failed: API yüklenemedi. URL’yi, boyutu ve sunucunun kullanılabilirliğini kontrol edin veya JSON yapıştırmayı kullanın.
    timeout: API isteğinin süresi doldu. Yeniden deneyin veya JSON yapıştırın.
    import-failed: Hatlar içe aktarılamadı. Hiçbir hat eklenmedi.
